# orukural-studio configuration. Secrets live in .env, never here.

series:
  name_ta: "ஒரு குறள் • ஒரு கதை"
  name_en: "Orukural Orukadhai"
  youtube_handle: "@orukural.orukadhai"
  instagram_handle: "orukural.orukadhai"
  language: ta

schedule:
  # Planning only (the calendar and the order episodes are made in). Never shown to viewers:
  # no description, caption or card names a posting day or time.
  timezone: Asia/Kolkata
  post_days: [mon, wed, sat]
  post_time: "19:00"
  episodes_per_week: 3
  weekly_job_day: sun

# The order episodes are made in: each a kural and the relationship its story is about
# (tags in data/themes.yaml). After the lineup, the remaining kurals follow in book order.
lineup:
  - {kural: 788, relationship: friends}
  - {kural: 1330, relationship: couple}
  - {kural: 100, relationship: siblings}
  - {kural: 467, relationship: office}
  - {kural: 785, relationship: friends}
  - {kural: 1100, relationship: love}
  - {kural: 190, relationship: colleagues}
  - {kural: 104, relationship: friends}

# Once a month a kids' special uses the kumbakonam series cast (Thatha, Kavin) instead of a new cast.
# Put it in the lineup as {kural: N, relationship: family, special: kids}; script-check counts the
# specials and the plan warns when a month has none or more than per_month.
# A new-cast story may also show Thatha as its family's grandfather on a video call (script
# thatha_cameo: true): his reference images and voice are reused and the cast log doesn't flag it.
kids_special:
  cast: kumbakonam
  per_month: 1

episode:
  target_seconds: [35, 45]
  aspect: "9:16"
  resolution: [1080, 1920]
  # beats, in seconds from the start
  structure:
    hook: [0, 3]
    story: [3, 25]
    kural: [25, 35]
    lesson: [35, 45]
  shots_per_episode: [6, 10]
  # Aim: 7 clips (four 8 s, three 4 s = 69 credits); a shot may reuse a clip for a second cut (clip_from).
  target_clips: 7
  # Tamil narration pace used to sanity-check script length before paying for voice.
  # Measured in Tamil letters (grapheme clusters) per second; tune after phase 2.
  narration_letters_per_second: 11

characters_file: data/characters.yaml
lessons_file: data/lessons_learned.md
pronunciation_file: data/pronunciation_fixes.yaml

script:
  # session: Claude writes the script in the weekly Claude session (no API cost);
  #   `studio.py script N` writes the prompt, Claude writes script.json, `script-check` validates.
  # anthropic: the API call below (~$0.10 a script).
  provider: session
  model: claude-sonnet-5-5
  effort: high               # low | medium | high | xhigh | max
  max_tokens: 16000
  # On a safety decline the API re-runs the request on Anthropic's recommended
  # fallback model inside the same call. Set to false to turn off.
  server_side_fallback: true
  hooks: 3
  hashtags: [3, 5]
  fixed_hashtags: ["#திருக்குறள்", "#thirukkural", "#ஒருகுறள்ஒருகதை"]

# ---------------------------------------------------------------------------
# Zero-spend mode (default until the channel earns):
#   scripts  → written by Claude in the weekly session, no API call   (script.provider: session)
#   images   → Google Flow via flow-mcp on your Mac, free             (images.provider: flow)
#   clips    → Google Flow, 50 free credits a day                     (video.provider: flow)
#   voice    → Google Cloud Text-to-Speech free tier                   (voice.provider: google_tts)
# Paid API providers stay available: switch a provider back when it's worth paying.
# Model IDs and prices checked on 25 Oct 2026. Veo 3.1 preview API models were shut
# down on 22 Oct 2026; Gemini Omni Flash replaces them.
# ---------------------------------------------------------------------------

images:
  provider: flow              # flow | gemini
  characters_dir: assets/characters   # series cast references (kumbakonam); an episode's own cast goes in episodes/<id>/refs/characters
  # gemini (paid API)
  model: gemini-nano-banana-2.1
  image_size: 2K              # 1K | 2K | 4K (uppercase K)
  price_per_image: {1K: 0.0336, 2K: 0.0504, 4K: 0.113}

video:
  provider: flow              # flow | gemini
  # Which shots get a real AI clip.
  #   all  — every shot (default: no pan/zoom over stills anywhere)
  #   key  — the first shot, the last shot, then the highest-priority shots up to max_animated_shots
  #   none — stills only
  animate: all
  max_animated_shots: 4
  clip_seconds: [4, 8]
  # gemini (paid API)
  model: gemini-omni-1.1-flash
  resolution: 720p            # we scale to 1080x1920 ourselves
  price_per_second: 0.10

flow:
  # Google AI Plus: 50 credits every day (use them or lose them) plus 200 a month.
  # One Flow project per episode ("K0788 – <short title>"), keyed by episode id, plus one shared
  # "recurring" project with Thatha and Kavin's references (kids' specials, video-call cameos).
  # The flow sheet asks for a new episode's link before its first image; record it with
  # `studio.py flow-project N <link>`.
  projects:
    recurring: null   # "Orukural – recurring": not created yet (Thatha/Kavin refs are in K0301's project for now)
    K0301: https://flow.google.com/project/b7755f8b-6f52-4abf-8563-86ab7a09d09d
    K0788: https://flow.google.com/u/2/project/dbd31b05-2737-4682-a9ab-b83a04d7ffdf   # new account (from 28 Oct)
    K0788_archived: https://flow.google.com/u/1/project/17cdee32-abf4-4416-8c3d-321b921530b4   # old account: refs, images, clips 1/3/4/5/6
  # From 28 Oct 2026 all Flow work runs on the new Google account only (Flow tab /u/2, PRO plan,
  # 1050 credits that day). Never switch back to the old /u/1 account. The flow sheet plans clips
  # against this pool instead of the old 50-a-day limit; per_reel_credits (75) still caps a reel.
  account: "/u/2"
  daily_credits: 1050
  monthly_credits: 0
  monthly_top_up_per_episode: 0
  video_model: "Omni Flash 720p"
  credits_per_clip: {4: 7, 8: 12, 10: 15}
  image_model: "Nano Banana 2 Lite"   # free in Flow

continuity:
  locations_dir: assets/locations   # one reference plate per recurring place, made once and committed
  max_refs_per_image: 3             # flow-mcp attaches at most 3; characters first, then the place, then props (the rest are described in words)
  # Assembly refuses to render until every image and clip is marked "pass" in
  # episodes/<id>/continuity_review.json (see .claude/skills/continuity-review).
  require_review: true

voice:
  provider: gemini_tts        # gemini_tts | google_tts | elevenlabs
  language_code: ta
  gap_seconds: 0.15           # silence between spoken segments
  # Voices are chosen per story: each character in the script's cast names its own Gemini TTS voice
  # (and voice_en, how it sounds to Flow). The narrator is always gemini_tts.voice (Charon) and says the kural.
  # The settings below are for the narrator and the optional kumbakonam series cast.
  # Each new line's pitch is measured: one outside its speaker's range means the wrong voice was used.
  expect_pitch_hz: {thatha: [70, 165], narrator: [70, 175], kavin: [170, 360]}
  # How each character sounds when Flow speaks their line in a clip (lip sync): the same words in every
  # prompt so Flow picks a similar voice each time (it can't take a voice sample).
  flow_voices:
    thatha: "the deep, slightly gravelly, warm voice of a 70-year-old Tamil grandfather, slow and kind"
    kavin: "the clear, high voice of an 8-year-old Tamil boy"
  gemini_tts:
    # Free on a Google AI Studio API key: no billing, no card (checked 25 Oct 2026).
    # Free-tier inputs/outputs may be used by Google to improve its models; fine for
    # public story scripts. Outputs are ours to use commercially (Gemini API terms).
    model: gemini-3.8-flash-tts
    voice: Charon                        # narrator: informative, male. Characters' voices come from the cast (no trial calls)
    speaker_voices:
      thatha: Algenib                    # gravelly, older male
      kavin: Leda                        # youthful and light, reads as a child
    language: ta-IN
    price_per_1k_chars: 0.0
    # The free tier allows only a few requests a minute and can hang instead of
    # answering 429, so calls are spaced out and cut off after a timeout, then retried.
    seconds_between_calls: 21
    timeout_seconds: 90
    retries: 5
  google_tts:
    # Free tier: 1M Chirp 3 HD characters a month, but Google Cloud billing must be
    # enabled first (in India that asks for a prepayment), so it is not the default.
    voice: ta-IN-Chirp3-HD-Charon        # narrator
    speaker_voices:
      thatha: ta-IN-Chirp3-HD-Iapetus
      kavin: ta-IN-Chirp3-HD-Puck
    speaking_rate: 0.95
    price_per_1k_chars: 0.0
  elevenlabs:
    # Paid plan needed for commercial use (the free plan forbids it and needs attribution).
    model: eleven_v4
    output_format: mp3_44100_128
    price_per_1k_chars: 0.08
    voice_id: a49ffQsGpRBw28CL67GF      # Yazhini – calm, expressive Tamil storyteller
    speaker_voices:
      thatha: 5RvT42yho9PKXu2vTVf5      # Mohanlal – natural, calm narrator
      kavin: null
    stability: 0.5
    similarity_boost: 0.8

# Exact lip sync: a character who says a line on screen says it in the Flow clip too; our voice is
# then fitted onto Flow's speech (orukural/lipsync.py). Pin speech spans in episodes/<id>/lipsync.json.
lipsync:
  enabled: true

music:
  dir: assets/music           # our own tracks from tools/make_music.py; any royalty-free file works too
  volume_db: -20              # music bed level under the narration
  duck: true                  # dip the music further while someone is speaking

assembly:
  fps: 30
  # Flow clips come with their own sound (footsteps, the puppy, the street): keep it under the voice.
  natural_sound: {enabled: true, volume_db: -6, mute_talking_shots: true}
  # No zooms or pans: a punch-in is a cut to a tighter crop of the same clip. 1.0 = off.
  punch_in: 1.0
  # edit.json "cut": the part of a clip after a cut is punched in this much, so the jump reads as a cut-in
  cut_punch: 1.12
  split_story_shots_over: 3.5 # seconds; only used when punch_in > 1.0
  # A shot that should have a clip but doesn't yet:
  #   wait  — stop and list the missing clips (make them after Flow credits reset)
  #   still — hold the still image without any movement
  missing_clip: wait
  crf: 18
  preset: medium
  audio_kbps: 192
  # `studio.py assemble 301 --final`: the upload master, slower and nearer lossless -> render/<id>_final.mp4
  final: {crf: 16, preset: slow, audio_kbps: 256}
  # Flow's sparkle watermark sits about here on every 1080x1920 frame; the badge covers it.
  watermark_cover:
    image: assets/brand/logo_badge.png   # the channel logo, small, over Flow's sparkle
    x: 825
    y: 1669

# The channel signature, added by assemble (orukural/signature.py); made here, no Flow credits.
# No intro before the hook: the logo badge (watermark_cover) already sits in its corner.
# `studio.py signature` builds the fixed parts into assets/brand/signature and renders previews.
signature:
  enabled: true
  dir: assets/brand/signature
  # The kural while the narrator says it. style: clean_text (chosen 28 Oct: the story dims to `dim`, the verse
  # writes in line by line, white, centred on screen) or slim_leaf (a thin see-through palm-leaf strip in the
  # subtitle zone, y ~1230-1540, the story keeps playing). Subtitles are off while the kural is on screen.
  kural: {style: clean_text, dim: 0.45, text_y: center, width: 0.88, height: 0.16, opacity: 0.88, y: 1230}
  flute: {volume_db: -14, sa: 293.66}      # the closing bansuri phrase under the logo ending
  ending: {image: assets/brand/logo_badge.png, seconds: 2.0}

captions:
  # One subtitle per spoken line, all in the same style and place, one at a time.
  fonts_dir: assets/fonts
  font: Noto Sans Tamil ExtraBold
  size: 52
  margin: 400               # px above the bottom edge: clear of the Shorts/Reels buttons and caption

budget:
  currency: USD
  per_episode_cap: 3.00       # hard stop before any paid call that would exceed it
  per_reel_credits: 75        # Flow clip credits one reel may use; script-check fails a plan above it
  weekly_cap: 10.00
  # Rough per-call estimates used by the guard before the real cost is known.
  estimates:
    script_call: 0.15
    character_ref: 0.06

review_gate: true             # REVIEW_GATE in .env overrides this
dry_run: false                # DRY_RUN in .env or --dry-run overrides this

paths:
  kurals: data/kurals.json
  episodes: episodes
  cache: cache
  review: review
  reports: reports
  ledger: logs/spend.jsonl

monetization:
  links:
    youtube_channel: "https://www.youtube.com/@orukural.orukadhai"
    link_in_bio: "{{LINK_IN_BIO}}"
    ebook: "{{EBOOK_LINK}}"
    merch: "{{MERCH_LINK}}"
    memberships: "{{MEMBERSHIPS_LINK}}"
